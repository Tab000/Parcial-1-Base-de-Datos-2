    <h2>Pregunta 6: Consulta Relacional (Clientes y Pedidos)</h2>

    <?php
    // 1. Conexión a la base de datos (puerto 3307 de XAMPP con respaldo a 3306)
    $conn = @mysqli_connect("127.0.0.1", "root", "", "parcial_bd2", 3307);
    if (!$conn) {
        $conn = mysqli_connect("127.0.0.1", "root", "", "parcial_bd2", 3306);
    }

    // 2. Consulta relacional: nombre del cliente, producto y monto
    $sql = "SELECT clientes.nombre, pedidos.producto, pedidos.monto, pedidos.id 
            FROM pedidos 
            INNER JOIN clientes ON pedidos.cliente_id = clientes.id";

    $resultado = mysqli_query($conn, $sql);
    ?>

    <!-- 3. Tabla HTML con los resultados -->
    <table>
        <tr>
            <th>Nombre del Cliente</th>
            <th>Producto</th>
            <th>Monto</th>
            <th>Acción</th>
        </tr>

        <?php if (mysqli_num_rows($resultado) > 0): ?>
            <?php while ($fila = mysqli_fetch_assoc($resultado)): ?>
            <tr>
                <td><?php echo $fila['nombre']; ?></td>
                <td><?php echo $fila['producto']; ?></td>
                <td>$<?php echo $fila['monto']; ?></td>
                <td>
                    <!-- Enlace que envía el id por método GET a eliminar.html -->
                    <a href="eliminar.html?id=<?php echo $fila['id']; ?>" class="btn-eliminar" onclick="return confirm('¿Seguro que desea eliminar este pedido?');">
                        Eliminar
                    </a>
                </td>
            </tr>
            <?php endwhile; ?>
        <?php else: ?>
            <tr>
                <td colspan="4" style="text-align: center; color: #777;">No hay pedidos registrados en la base de datos.</td>
            </tr>
        <?php endif; ?>
    </table>
